<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Saúde Brasil 360 — Componente Qualidade da APS</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --success-text:#006300;
  --radius:10px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --success-text:#0ca30c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 64px}

header.top{background:var(--surface-1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.topinner{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand .txt{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-size:18px;letter-spacing:-0.01em}
.brand .sub{font-size:12.5px;color:var(--text-secondary)}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-1);color:var(--text-primary);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--plane)}
.btn.primary{background:var(--s1);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}

nav.tabs{background:var(--surface-1);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:57px;z-index:35}
.tabsinner{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;gap:1px}
.tab{font:inherit;font-size:13px;padding:10px 11px;border:0;background:none;color:var(--text-secondary);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text-primary)}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--s1);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--axis);margin-right:5px;vertical-align:middle}
.tab .dot.on{background:var(--good)}

section.panel{display:none;padding-top:20px}
section.panel.active{display:block}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px;letter-spacing:-0.01em}
.card h3{margin:18px 0 2px;font-size:14px}
.card .desc{margin:0 0 14px;font-size:13px;color:var(--text-secondary)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}}

.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.tile .lab{font-size:12px;color:var(--text-secondary);margin-bottom:6px;display:block}
.tile .val{font-size:30px;font-weight:600;letter-spacing:-0.02em;line-height:1.1}
.tile .val small{font-size:14px;font-weight:500;color:var(--text-secondary);margin-left:3px}
.tile .foot{font-size:12px;color:var(--muted);margin-top:5px}

.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.heronum{font-size:60px;font-weight:600;letter-spacing:-0.03em;line-height:1}
.heronum small{font-size:19px;color:var(--text-secondary);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  padding:4px 11px;border-radius:999px;border:1px solid var(--border)}
.b-otimo{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--success-text)}
.b-bom{background:color-mix(in srgb,var(--s1) 14%,transparent);color:var(--s1)}
.b-suf{background:color-mix(in srgb,var(--warning) 20%,transparent);color:#7a5300}
.b-reg{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)}
:root[data-theme="dark"] .b-suf{color:var(--warning)}

.bars{display:flex;flex-direction:column;gap:2px}
.barrow{display:grid;grid-template-columns:300px 1fr 62px;gap:12px;align-items:center;padding:3px 0;border-radius:6px}
.barrow.clickable{cursor:pointer}
.barrow.clickable:hover{background:color-mix(in srgb,var(--s1) 7%,transparent)}
.barrow .name{font-size:12.5px;color:var(--text-secondary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .track{height:20px;background:var(--grid);border-radius:4px;position:relative;overflow:hidden}
.barrow .fill{height:100%;border-radius:0 4px 4px 0;background:var(--s1);transition:width .35s ease}
.barrow .num{font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:640px){.barrow{grid-template-columns:120px 1fr 52px}}

.tablewrap{overflow:auto;max-height:640px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-1)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-1);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--muted);cursor:pointer;z-index:2}
th:hover{color:var(--text-primary)}
tbody tr:hover{background:color-mix(in srgb,var(--s1) 6%,transparent)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--success-text)}
.no{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)}
.na{background:var(--grid);color:var(--muted)}
.info{background:color-mix(in srgb,var(--s1) 14%,transparent);color:var(--s1)}
.pillrow{display:flex;gap:5px;flex-wrap:nowrap;align-items:center}
.pill{min-width:26px;height:26px;padding:0 6px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  gap:3px;font-size:12.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill .pv{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.y{background:var(--good);color:#fff}
.pill.n{background:color-mix(in srgb,var(--critical) 22%,transparent);color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,transparent)}
.pill.p{background:var(--grid);color:var(--muted)}
.pill.x{background:transparent;color:var(--axis);border:1px dashed var(--axis)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.fgroup{display:flex;flex-direction:column;gap:4px}
.fgroup label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
select,input[type=search],input[type=number],input[type=text]{font:inherit;font-size:13px;padding:6px 9px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);min-width:140px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}

.empty{border:1px dashed var(--axis);border-radius:var(--radius);padding:26px;text-align:center;color:var(--text-secondary);font-size:13.5px}
.note{font-size:12.5px;color:var(--text-secondary);background:color-mix(in srgb,var(--s1) 6%,transparent);
  border-left:3px solid var(--s1);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.note.warn{background:color-mix(in srgb,var(--warning) 12%,transparent);border-left-color:var(--warning)}
.pend{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;background:var(--surface-1)}
.pend summary{cursor:pointer;font-size:13.5px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pend summary::-webkit-details-marker{display:none}
.pend .names{margin-top:10px;font-size:12.5px;color:var(--text-secondary);line-height:1.9}
.pend .nm{display:inline-block;background:var(--plane);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:0 4px 4px 0}
/* checklist de pendências */
.pendtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pbar{flex:1;min-width:180px;height:8px;background:var(--grid);border-radius:999px;overflow:hidden}
.pbar > i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s ease}
.plist{margin-top:10px;display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
.pitem{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:6px 8px;
  border-radius:7px;cursor:pointer;font-size:13px}
.pitem .evo{display:inline-grid;grid-template-columns:70px 34px 150px;gap:8px;align-items:center;font-size:12px}
.pitem .evo b{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.pitem .evo small{color:var(--text-secondary);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .evbar{height:7px;background:var(--grid);border-radius:4px;overflow:hidden}
.pitem .evbar i{display:block;height:100%;border-radius:4px}
.pitem.done .evo{opacity:.5}
@media(max-width:760px){.pitem{grid-template-columns:22px 1fr}.pitem .evo,.pitem .meta{grid-column:2}}
.pitem:hover{background:color-mix(in srgb,var(--s1) 7%,transparent)}
.pitem input{width:16px;height:16px;accent-color:var(--good);cursor:pointer;margin:0}
.pitem .who{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .meta{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.pitem.done .who,.pitem.done .meta{text-decoration:line-through;color:var(--muted)}
.pitem.done{background:color-mix(in srgb,var(--good) 8%,transparent)}
.pitem .tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.pitem .tag.v{background:color-mix(in srgb,var(--critical) 16%,transparent);color:var(--critical)}
.pitem .tag.a{background:var(--grid);color:var(--muted)}
.psearch{margin:8px 0 0;width:100%}
@media(max-width:640px){.pitem{grid-template-columns:22px 1fr}.pitem .meta{display:none}}
.footer{font-size:12px;color:var(--muted);text-align:center;padding:26px 0 0;line-height:1.7}
.k{font-weight:600;color:var(--text-primary)}
.maprow{display:grid;grid-template-columns:230px 1fr 110px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--grid)}
.maprow:last-child{border-bottom:0}
.maprow .mk{font-size:12.5px}
.maprow select{width:100%;min-width:0}
@media(max-width:700px){.maprow{grid-template-columns:1fr}}
#drop{position:fixed;inset:0;background:color-mix(in srgb,var(--s1) 22%,transparent);z-index:99;
  display:none;align-items:center;justify-content:center;font-size:20px;font-weight:600}
#drop.on{display:flex}
@media print{header.top,nav.tabs,.filters,.btn{display:none!important} section.panel{display:block!important}
  .tablewrap{max-height:none} body{background:#fff}}
</style>
</head>
<body>
<div id="drop">Solte os arquivos CSV do e-SUS aqui</div>

<header class="top">
  <div class="topinner">
    <div class="brand">
      <div class="txt">
        <h1>Painel Saúde Brasil 360</h1>
        <div class="sub" id="ctx">Nenhum relatório carregado</div>
      </div>
    </div>
    <button class="btn primary" id="btnLoad">Carregar CSV do e-SUS</button>
    <button class="btn" id="btnExport">Exportar pendências</button>
    <button class="btn" id="btnPrint">Imprimir</button>
    <button class="btn" id="btnTheme">Tema</button>
    <input type="file" id="file" accept=".csv,text/csv" multiple hidden>
    <input type="file" id="fileProg" accept=".json,application/json" hidden>
  </div>
</header>

<nav class="tabs"><div class="tabsinner" id="tabs"></div></nav>

<div class="wrap">
  <section class="panel active" id="p-geral"></section>
  <section class="panel" id="p-C1"></section>
  <section class="panel" id="p-C2"></section>
  <section class="panel" id="p-C3"></section>
  <section class="panel" id="p-C4"></section>
  <section class="panel" id="p-C5"></section>
  <section class="panel" id="p-C6"></section>
  <section class="panel" id="p-C7"></section>
  <section class="panel" id="p-metodo"></section>
  <div class="footer">
    Painel construído sobre o relatório de Acompanhamento de Condições de Saúde do e-SUS APS.<br>
    Processamento 100% local no navegador. Nenhum dado pessoal é transmitido.
  </div>
</div>

<script>
/* ============================================================
   0. UTILITÁRIOS
   ============================================================ */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseInt(String(v||'').replace(/[^\d-]/g,''),10); return isNaN(n)?0:n; };
const flt = v => { const n = parseFloat(String(v||'').replace(',','.')); return isNaN(n)?null:n; };
const sim = v => String(v||'').trim().toUpperCase()==='SIM';
const vazio = v => !v || String(v).trim()==='' || String(v).trim()==='-';

function parseData(s){
  if(vazio(s)) return null;
  let m = String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}
const fmtDate = s => { const d = parseData(s); return d? d.toLocaleDateString('pt-BR') : '—'; };
const diasEntre = (a,b) => Math.round((a-b)/86400000);

/* dias desde uma data registrada em coluna, tomando como hoje a data de geração do relatório */
function diasDesdeData(r, col, hoje){
  if(!col) return null;
  const d = parseData(r[col]);
  if(!d) return Infinity;
  return diasEntre(hoje, d);
}
/* colunas do tipo "Dias desde o último ..." */
function diasDesdeCol(r, col){
  if(!col) return null;
  const v = r[col];
  if(vazio(v)) return Infinity;
  return num(v);
}
function idadeAnos(r, colIdade, colNasc, hoje){
  const t = r[colIdade];
  let m = String(t||'').match(/(\d+)\s*anos?/i);
  if(m) return +m[1];
  const d = parseData(r[colNasc]);
  if(d) return Math.floor(diasEntre(hoje,d)/365.25);
  if(/m[êe]s|dias/i.test(String(t||''))) return 0;
  return null;
}

/* ============================================================
   1. PARSER DO RELATÓRIO e-SUS
   ============================================================ */

function splitCsvLine(line){
  const out=[]; let cur=""; let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c === '"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c === ';' && !q){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out;
}
function decodeBytes(buf){
  const bytes = new Uint8Array(buf);
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(bytes); }
  catch(e){ return new TextDecoder('iso-8859-1').decode(bytes); }
}

function parseEsus(text, filename){
  const lines = text.split(/\r?\n/);
  const hi = lines.findIndex(l => /^Nome;/.test(l) || /^Nome do cidad/i.test(l));
  if(hi < 0) throw new Error("Cabeçalho não encontrado. Este arquivo não parece ser um relatório do e-SUS APS.");
  const vacinacao = /^Nome do cidad/i.test(lines[hi]);
  const meta = {arquivo:filename, municipio:'', unidade:'', equipe:'', tema:'', periodo:'', gerado:'', hoje:new Date(), vacinacao};
  for(let i=0;i<hi;i++){
    const l = lines[i];
    if(/^MUNIC[ÍI]PIO DE /i.test(l)) meta.municipio = l.replace(/^MUNIC[ÍI]PIO DE /i,'').replace(/;+$/,'').trim();
    if(/^UNIDADE DE SA[ÚU]DE /i.test(l)) meta.unidade = l.replace(/^UNIDADE DE SA[ÚU]DE /i,'').replace(/;+$/,'').trim();
    if(/^Equipe respons/i.test(l)) meta.equipe = (splitCsvLine(l)[1]||'').trim();
    if(/^Lista tem/i.test(l)) meta.tema = (splitCsvLine(l)[1]||'').trim();
    if(/^Grupo-alvo/i.test(l)) meta.grupo = (splitCsvLine(l)[1]||'').trim();
    if(/^Faixa et[áa]ria/i.test(l)){
      meta.faixaTxt = (splitCsvLine(l)[1]||'').trim();
      const m = meta.faixaTxt.match(/(\d+)\s*(?:at[ée]|a)\s*(\d+)/);
      meta.faixa = m ? [+m[1], +m[2]] : null;
    }
    if(/^Status da vacina/i.test(l)) meta.statusFiltro = (splitCsvLine(l)[1]||'').trim();
    if(/^Per[íi]odo/i.test(l) && !meta.periodo) meta.periodo = (splitCsvLine(l)[1]||'').trim();
    if(/^Gerado em/i.test(l)){ const p=splitCsvLine(l); meta.gerado=(p[1]||'')+' '+(p[3]||''); const d=parseData(p[1]); if(d) meta.hoje=d; }
  }
  const header = splitCsvLine(lines[hi]).map(s=>s.trim()).filter(h=>h);
  const headerRaw = splitCsvLine(lines[hi]).map(s=>s.trim());
  const rows = [];
  for(let i=hi+1;i<lines.length;i++){
    const l = lines[i];
    if(!l.trim()) continue;
    const c = splitCsvLine(l);
    if(c.length < 8 || !c[0].trim()) continue;
    const o = {};
    headerRaw.forEach((h,j)=>{ if(h) o[h] = (c[j]||'').trim(); });
    rows.push(o);
  }
  if(vacinacao){ meta.code = 'VAC'; return {meta, header, rows}; }
  const hit = INDIC.find(t => t.tema && t.tema.test(meta.tema));
  meta.code = hit ? hit.code : null;
  return {meta, header, rows};
}

/* ============================================================
   1b. RELATÓRIO DE BUSCA ATIVA DE VACINAÇÃO
   ============================================================ */
const VCOL = {nome:'Nome do cidadão', nasc:'Data de nascimento', idade:'Idade', sexo:'Sexo',
  cpf:'CPF', cns:'CNS', cel:'Telefone celular', contato:'Telefone de contato', res:'Telefone residencial',
  micro:'Microárea', rua:'Rua', bairro:'Bairro', status:'Status da vacina',
  imuno:'Imunobiológico', dose:'Dose'};

/* imunobiológicos que compõem a boa prática E do C2, conforme a nota metodológica:
   pentavalente 3 doses, poliomielite inativada 3 doses, tríplice viral 2 doses e pneumocócica 2 doses */
const VAC_PADRAO_C2 = [/penta/i, /inativada poliomielite/i, /^vacina.*poliomielite oral|^vop/i,
  /tr[íi]plice viral/i, /tetraviral/i, /pneumo\s*10/i, /pneumo\s*20/i];
const DOSE_PRIMARIA = /^(D|D1|D2|D3|DU)$/i;

function limpaId(v){ return String(v||'').replace(/["\s.\-\/]/g,'').trim(); }
function idVac(o, cnsCol, cpfCol, nomeCol){
  return limpaId(o[cnsCol]) || limpaId(o[cpfCol]) || String(o[nomeCol]||'').toUpperCase().replace(/\s+/g,' ').trim();
}

/* vários relatórios de vacinação são combinados em um só conjunto de pessoas */
function mergeVacinas(){
  if(!STATE.vacinas.length){ STATE.vacina = null; return; }
  const partes = STATE.vacinas.map(buildVacina);
  const pessoas = new Map(); const rows = []; const metas = [];
  partes.forEach(p=>{
    metas.push(p.meta); rows.push(...p.rows);
    p.pessoas.forEach((v,k)=>{
      if(!pessoas.has(k)) pessoas.set(k, {...v, doses:[...v.doses]});
      else{
        const alvo = pessoas.get(k);
        v.doses.forEach(d=>{ if(!alvo.doses.some(x=>x.imuno===d.imuno && x.dose===d.dose)) alvo.doses.push(d); });
      }
    });
  });
  const imunos = [...new Set([...pessoas.values()].flatMap(p=>p.doses.map(d=>d.imuno)).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,'pt-BR'));
  imunos.forEach(im=>{ if(STATE.vacSel[im]===undefined) STATE.vacSel[im] = VAC_PADRAO_C2.some(re=>re.test(im)); });
  STATE.vacina = {meta:metas[0], metas, header:partes[0].header, rows, pessoas, imunos,
                  grupos:[...new Set(metas.map(m=>m.grupo).filter(Boolean))]};
}

function buildVacina(ds){
  const rows = ds.rows.filter(r=> /atrasad/i.test(r[VCOL.status]||''));
  const pessoas = new Map();
  rows.forEach(r=>{
    const id = idVac(r, VCOL.cns, VCOL.cpf, VCOL.nome);
    if(!pessoas.has(id)) pessoas.set(id, {
      id, nome:r[VCOL.nome], idade:r[VCOL.idade], nasc:r[VCOL.nasc],
      anos: idadeAnos(r, VCOL.idade, VCOL.nasc, ds.meta.hoje),
      meses: idadeMeses(r, VCOL.idade, VCOL.nasc, ds.meta.hoje),
      sexo:r[VCOL.sexo]||'', micro:(r[VCOL.micro]||'').replace(/"/g,''),
      tel:r[VCOL.cel]||r[VCOL.contato]||r[VCOL.res]||'',
      end:(r[VCOL.rua]||'')+', '+(r[VCOL.bairro]||''), doses:[]});
    pessoas.get(id).doses.push({imuno:r[VCOL.imuno], dose:r[VCOL.dose]});
  });
  const imunos = [...new Set(rows.map(r=>r[VCOL.imuno]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  return {meta:ds.meta, header:ds.header, rows, pessoas, imunos};
}

function idadeMeses(r, colIdade, colNasc, hoje){
  const t = String(r[colIdade]||'');
  const a = (t.match(/(\d+)\s*anos?/i)||[])[1];
  const m = (t.match(/(\d+)\s*(m[êe]s|meses)/i)||[])[1];
  if(a!==undefined || m!==undefined) return (+(a||0))*12 + (+(m||0));
  const d = parseData(r[colNasc]);
  return d ? Math.floor(diasEntre(hoje,d)/30.44) : null;
}
/* doses atrasadas que impactam a prática E do C2 */
function dosesC2(pessoa){
  return pessoa.doses.filter(d=> STATE.vacSel[d.imuno] &&
    (!STATE.vacSoPrimaria || DOSE_PRIMARIA.test(d.dose||'')));
}
function pessoaVac(idCns, idCpf, nome){
  if(!STATE.vacina) return null;
  const k = limpaId(idCns) || limpaId(idCpf) || String(nome||'').toUpperCase().replace(/\s+/g,' ').trim();
  return STATE.vacina.pessoas.get(k) || null;
}

const dataEm = (key, dias)=> (r,c,ctx)=>{
  if(!c[key]) return null;
  const d = diasDesdeData(r, c[key], ctx.hoje);
  return d !== null && d <= dias;

const visitasEm = (dias)=> (r,c)=>{
  if(!c.dVis) return null;
  return diasDesdeCol(r,c.dVis) <= dias;
};
/* usa a data mais recente entre várias colunas candidatas */
const melhorDataEm = (keys, dias)=> (r,c,ctx)=>{
  const cols = keys.map(k=>c[k]).filter(Boolean);
  if(!cols.length) return null;
  const vs = cols.map(col=>{ const d = parseData(r[col]); return d? diasEntre(ctx.hoje,d) : null; })
                 .filter(v=>v!==null);
  return vs.length ? Math.min(...vs) <= dias : false;
};
/* coluna genérica que pode conter data, "SIM"/"NAO" ou quantidade */
const registroEm = (key, dias)=> (r,c,ctx)=>{
  const col = c[key]; if(!col) return null;
  const v = r[col];
  if(vazio(v)) return false;
  if(/^(sim|s)$/i.test(v)) return true;
  if(/^(n[ãa]o|n|nao_se_aplica)$/i.test(v)) return false;
  const d = parseData(v);
  if(d) return diasEntre(ctx.hoje,d) <= dias;
  const n = num(v);
  if(!isNaN(n) && /quantidade|doses?|n[ºo°]/i.test(col)) return n >= 1;
  if(!isNaN(n) && /dias/i.test(col)) return n <= dias;
  if(!isNaN(n) && /meses/i.test(col)) return n <= Math.round(dias/30);
  return !vazio(v);
};

/* evolução de cada gestante em direção à meta de uma prática do C3 */
function evolucaoC3(r, id){
  const C = C3COL;
  const q = (v, alvo, und) => { const n = num(v); return {v:Math.min(n,alvo), n, alvo,
    txt:`${n}/${alvo}`, falta: n>=alvo ? '' : `faltam ${alvo-n} ${alvo-n===1?und[0]:und[1]}`}; };
  const exames = (lista) => { const feitos = lista.filter(([,k])=>sim(r[C[k]]));
    const falt = lista.filter(([,k])=>!sim(r[C[k]])).map(([n])=>n);
    return {v:feitos.length, n:feitos.length, alvo:lista.length, txt:`${feitos.length}/${lista.length}`,
      falta: falt.length ? 'falta: '+falt.join(', ') : ''}; };
  switch(id){
    case 'A': return q(r[C.atend12], 1, ['consulta até 12 sem','consultas até 12 sem']);
    case 'B': return q(r[C.atendPN], 7, ['consulta','consultas']);
    case 'C': return q(r[C.pa], 7, ['aferição','aferições']);
    case 'D': return q(r[C.pesoalt], 7, ['registro','registros']);
    case 'E': return q(r[C.vdPN], 3, ['visita','visitas']);
    case 'F': { const ok = !vazio(r[C.dtpa]); return {v:ok?1:0, n:ok?1:0, alvo:1, txt:ok?'1/1':'0/1', falta: ok?'':'sem registro de dTpa'}; }
    case 'G': return exames([['sífilis','sif1'],['HIV','hiv1'],['hepatite B','hepb1'],['hepatite C','hepc1']]);
    case 'H': return exames([['sífilis','sif3'],['HIV','hiv3']]);
    case 'I': return q(r[C.atendPuerp], 1, ['consulta','consultas']);
    case 'J': return q(r[C.vdPuerp], 1, ['visita','visitas']);
    case 'K': return q(r[C.odonto], 1, ['atendimento','atendimentos']);
  }
  return null;
}
function avaliarC3(r){
  const C = C3COL;
  const ig = num(r[C.igS]) || num(r[C.igES]) || 0;
  const puerpera = num(r[C.atendPuerp])>0 || !vazio(r[C.ultPuerp]) || ig>=42;
  const res = {
    A: num(r[C.atend12])>=1, B: num(r[C.atendPN])>=7, C: num(r[C.pa])>=7,
    D: num(r[C.pesoalt])>=7, E: num(r[C.vdPN])>=3, F: !vazio(r[C.dtpa]),
    G: sim(r[C.hiv1])&&sim(r[C.sif1])&&sim(r[C.hepb1])&&sim(r[C.hepc1]),
    H: sim(r[C.hiv3])&&sim(r[C.sif3]),
    I: num(r[C.atendPuerp])>=1, J: num(r[C.vdPuerp])>=1, K: num(r[C.odonto])>=1
  };
  const devido = {};
  PRAT3.forEach(p=>{
    devido[p.id] = (p.id==='I'||p.id==='J') ? puerpera : (p.id==='A' ? true : ig >= p.devidoIG);
  });
  let bruto=0, ganho=0, possivel=0;
  PRAT3.forEach(p=>{
    if(res[p.id]) bruto += p.pts;
    if(devido[p.id]){ possivel += p.pts; if(res[p.id]) ganho += p.pts; }
  });
  return {res, devido, ig, puerpera, bruto, ajust: possivel? Math.round(ganho/possivel*1000)/10 : 100, possivel};
}

/* ============================================================
   4. RESOLUÇÃO DE COLUNAS
   ============================================================ */
function resolveCols(ds){
  const def = byCode(ds.meta.code);
  const need = Object.assign({}, P);
  (def.cols||[]).forEach(k=> need[k] = PX[k]);
  ds.colDef = need;
  ds.col = ds.col || {};
  Object.keys(need).forEach(k=>{
    if(ds.colManual && ds.colManual[k] !== undefined){ ds.col[k] = ds.colManual[k] || null; return; }
    const hit = need[k].pat.map(p=> ds.header.find(h=>p.test(h))).find(Boolean);
    ds.col[k] = hit || null;
  });
}

/* ============================================================
   5. CÁLCULO GENÉRICO
   ============================================================ */
function classificar(v, faixas){
  if(faixas){
    for(const f of faixas) if(v<=f.max) return mapCls(f.cls, f.lab);
    return mapCls('reg','Regular');
  }
  if(v>75) return mapCls('otimo','Ótimo');
  if(v>50) return mapCls('bom','Bom');
  if(v>25) return mapCls('suf','Suficiente');
  return mapCls('reg','Regular');
}
function mapCls(k,lab){
  const m = {otimo:{cls:'b-otimo',color:'var(--good)',ic:'●'}, bom:{cls:'b-bom',color:'var(--s1)',ic:'●'},
             suf:{cls:'b-suf',color:'var(--warning)',ic:'▲'}, reg:{cls:'b-reg',color:'var(--critical)',ic:'■'}};
  return Object.assign({k, label:lab}, m[k]);
}

function computar(ds){
  const def = byCode(ds.meta.code);
  if(def.tipo==='c3'){ computarC3(ds); return; }
  resolveCols(ds);
  const ctx = {hoje: ds.meta.hoje};
  const n = ds.rows.length || 1;
  ds.rows.forEach(r=>{
    const res={}, aplic={};
    def.praticas.forEach(p=>{
      const idade = def.tipo==='faixas' ? idadeAnos(r, ds.col.idade, ds.col.nasc, ctx.hoje) : null;
      const naFaixa = !p.faixa || (idade!==null && idade>=p.faixa[0] && idade<=p.faixa[1]);
      aplic[p.id] = naFaixa;
      res[p.id] = naFaixa ? p.ev(r, ds.col, ctx) : null;   // null = não avaliável ou fora de faixa
    });
    /* prática E do C2 alimentada pelo relatório de busca ativa de vacinação, quando carregado */
    if(def.code==='C2' && STATE.vacina){
      const pv = pessoaVac(r[ds.col.cns], r[ds.col.cpf], r[ds.col.nome]);
      r._vac = pv;
      r._vacDoses = pv ? dosesC2(pv) : [];
      res.E = r._vacDoses.length === 0;
      aplic.E = true;
    }
    const obtidos = def.praticas.filter(p=>res[p.id]===true).reduce((a,p)=>a+p.pts,0);
    const avaliaveis = def.praticas.filter(p=>res[p.id]!==null).reduce((a,p)=>a+p.pts,0);
    r._av = {res, aplic, idade: idadeAnos(r, ds.col.idade, ds.col.nasc, ctx.hoje),
             bruto: obtidos, avaliaveis, verif: avaliaveis? Math.round(obtidos/avaliaveis*1000)/10 : null};
  });

  const pct={}, cnt={}, denom={}, naoAval={};
  def.praticas.forEach(p=>{
    const elig = ds.rows.filter(r=>r._av.res[p.id]!==null);
    denom[p.id] = elig.length;
    cnt[p.id] = elig.filter(r=>r._av.res[p.id]===true).length;
    pct[p.id] = elig.length? cnt[p.id]/elig.length*100 : null;
    naoAval[p.id] = elig.length===0;
  });

  let bruto;
  if(def.tipo==='faixas'){
    // cada prática tem seu próprio denominador (faixa etária); soma ponderada, máximo 100
    bruto = def.praticas.reduce((a,p)=> a + (pct[p.id]===null?0:p.pts*pct[p.id]/100), 0);
  }else{
    bruto = ds.rows.reduce((a,r)=>a+r._av.bruto,0)/n;
  }
  const ptsAvaliaveis = def.praticas.filter(p=>!naoAval[p.id]).reduce((a,p)=>a+p.pts,0);
  const verif = ptsAvaliaveis? bruto/ptsAvaliaveis*100 : null;

  /* denominador truncado pelo filtro de faixa etária usado na exportação */
  const fx = ds.meta.faixa;
  const trunc = {};
  def.praticas.forEach(p=>{
    trunc[p.id] = !!(p.faixa && fx && (fx[0] > p.faixa[0] || fx[1] < p.faixa[1]));
  });
  const ptsIntegros = def.praticas.filter(p=>!trunc[p.id] && !naoAval[p.id]).reduce((a,p)=>a+p.pts,0);
  let notaIntegra = null;
  if(def.tipo==='faixas' && ptsIntegros>0 && ptsIntegros<100){
    const soma = def.praticas.filter(p=>!trunc[p.id] && pct[p.id]!==null)
      .reduce((a,p)=> a + p.pts*pct[p.id]/100, 0);
    notaIntegra = soma/ptsIntegros*100;
  }

  let pendTotal=0, recuperavel=0; const pessoas=new Set(); const ganho={};
  def.praticas.forEach(p=>{
    const f = ds.rows.filter(r=>r._av.res[p.id]===false).length;
    // ganho na nota da equipe se todas as pendências desta prática forem resolvidas
    ganho[p.id] = def.tipo==='faixas'
      ? (denom[p.id]? p.pts*f/denom[p.id] : 0)
      : p.pts*f/n;
    recuperavel += ganho[p.id];
  });
  ds.rows.forEach((r,ix)=> def.praticas.forEach(p=>{
    if(r._av.res[p.id]===false){ pendTotal++; pessoas.add(ix); }
  }));
  ds.resumo = {bruto:Math.round(bruto*10)/10, verif: verif===null?null:Math.round(verif*10)/10,
    pct, cnt, denom, naoAval, ptsAvaliaveis, pendTotal, pendPessoas:pessoas.size, ganho, recuperavel,
    trunc, ptsIntegros, notaIntegra: notaIntegra===null?null:Math.round(notaIntegra*10)/10};
}

function computarC3(ds){
  ds.rows.forEach(r=> r._av = avaliarC3(r));
  const n = ds.rows.length || 1;
  const pct={}, cnt={}, denom={};
  PRAT3.forEach(p=>{ cnt[p.id]=ds.rows.filter(r=>r._av.res[p.id]).length; pct[p.id]=cnt[p.id]/n*100; denom[p.id]=n; });
  let pendTotal=0, recuperavel=0; const pessoas=new Set();
  ds.rows.forEach((r,ix)=>PRAT3.forEach(p=>{
    if(!r._av.res[p.id] && r._av.devido[p.id]){ pendTotal++; recuperavel += p.pts/n; pessoas.add(ix); }
  }));
  ds.resumo = {
    bruto: Math.round(ds.rows.reduce((a,r)=>a+r._av.bruto,0)/n*10)/10,
    ajust: Math.round(ds.rows.reduce((a,r)=>a+r._av.ajust,0)/n*10)/10,
    pct, cnt, denom, naoAval:{}, ptsAvaliaveis:100, pendTotal, pendPessoas:pessoas.size, recuperavel};
}

   6. ESTADO
   ============================================================ */
const STATE = {datasets:{}, ordem:{}, c1:[{equipe:'', prog:'', total:''}], feito:{},
               vacinas:[], vacina:null, vacSel:{}, vacSoPrimaria:true};

/* ---------- checklist de pendências ---------- */
function praticasDe(code){ return code==='C3' ? PRAT3 : byCode(code).praticas; }
function colsDe(code){
  const ds = STATE.datasets[code];
  if(code==='C3') return {nome:'Nome', micro:C3COL.micro, tel:C3COL.cel, tel2:C3COL.contato, cpf:C3COL.cpf, cns:C3COL.cns};
  return {nome:ds.col.nome, micro:ds.col.micro, tel:ds.col.tel, tel2:null, cpf:ds.col.cpf, cns:ds.col.cns};
}
/* 'ok' cumprida | 'venc' pendente e exigível | 'aven' pendente a vencer | 'na' não avaliável */
function statusPratica(code, r, p){
  if(code==='C3') return r._av.res[p.id] ? 'ok' : (r._av.devido[p.id] ? 'venc' : 'aven');
  const v = r._av.res[p.id];
  return v===true ? 'ok' : v===false ? 'venc' : 'na';
}
function idPessoa(code, r){
  const c = colsDe(code);
  return String(r[c.cns] || r[c.cpf] || r[c.nome] || '').replace(/\s+/g,' ').trim();
}
const chaveFeito = (code, r, pid) => code+'|'+idPessoa(code,r)+'|'+pid;
const marcado = (code, r, pid) => !!STATE.feito[chaveFeito(code,r,pid)];

function denomPratica(code, pid){
  const ds = STATE.datasets[code];
  if(code!=='C3' && byCode(code).tipo==='faixas') return ds.resumo.denom[pid] || ds.rows.length;
  return ds.rows.length;
}
function projecao(code){
  const ds = STATE.datasets[code];
  let add = 0;
  praticasDe(code).forEach(p=>{
    const feitas = ds.rows.filter(r=> statusPratica(code,r,p)!=='ok' && statusPratica(code,r,p)!=='na' && marcado(code,r,p.id)).length;
    add += p.pts * feitas / denomPratica(code, p.id);
  });
  return {nota: Math.min(100, ds.resumo.bruto + add), ganho: add};
}
function contagemFeito(code){
  const ds = STATE.datasets[code];
  let tot=0, ok=0;
  praticasDe(code).forEach(p=> ds.rows.forEach(r=>{
    const s = statusPratica(code,r,p);
    if(s==='venc' || s==='aven'){ tot++; if(marcado(code,r,p.id)) ok++; }
  }));
  return {tot, ok};
}

        <div class="track"><div class="fill" style="width:${Math.min(pct/max*100,100)}%;background:${c.color}"></div></div>
        <div class="num">${pct.toFixed(0)}%</div></div>`;
    }).join('') || '<div class="empty">Informe os atendimentos acima para gerar o comparativo.</div>'}</div>
    <div class="legend">
      <span><i class="sw" style="background:var(--critical)"></i>≤10% ou &gt;70% Regular</span>
      <span><i class="sw" style="background:var(--warning)"></i>&gt;10 a 30% Suficiente</span>
      <span><i class="sw" style="background:var(--s1)"></i>&gt;30 a 50% Bom</span>
      <span><i class="sw" style="background:var(--good)"></i>&gt;50 a 70% Ótimo</span>
    </div>
  </div>`;
  document.querySelectorAll('#c1body input').forEach(inp=>inp.oninput=()=>{
    STATE.c1[+inp.dataset.ix][inp.dataset.f] = inp.value;
    const foco = inp.dataset.ix+'|'+inp.dataset.f;
    renderC1(); renderOverview(); buildTabs();
    const back = document.querySelector(`#c1body input[data-ix="${foco.split('|')[0]}"][data-f="${foco.split('|')[1]}"]`);
    if(back){ back.focus(); try{ back.setSelectionRange(back.value.length, back.value.length); }catch(e){} }
  });
  document.getElementById('c1add').onclick = ()=>{ STATE.c1.push({equipe:'',prog:'',total:''}); renderC1(); };
  document.getElementById('c1del').onclick = ()=>{ if(STATE.c1.length>1){ STATE.c1.pop(); renderC1(); renderOverview(); } };
}

function renderBars(code){
  const def = byCode(code), ds = STATE.datasets[code], R = ds.resumo;
  document.getElementById('bars-'+code).innerHTML = def.praticas.map(p=>{
    let pct = R.pct[p.id];
    let detalhe = '';
    
    // Para C2, mostrar estatísticas numéricas mesmo se pct é null
    if(code==='C2' && (p.id==='B' || p.id==='C' || p.id==='D')){
      const colMap = {B: ds.col.qAtend, C: ds.col.qPesoAlt, D: ds.col.qVis};
      const colKey = colMap[p.id];
      const alvo = {B: 9, C: 9, D: 2}[p.id];
      if(colKey){
        const vals = ds.rows.map(r=>num(r[colKey]));
        if(vals.length>0){
          const med = vals.reduce((a,b)=>a+b,0)/vals.length;
          const min = Math.min(...vals);
          const max = Math.max(...vals);
          const comMetaAtingida = vals.filter(v=>v>=alvo).length;
          // Se pct é null mas temos dados, calcular o percentual
          if(pct === null){
            pct = (comMetaAtingida/vals.length)*100;
          }
          detalhe = ` · min: ${min}, máx: ${max}, méd: ${med.toFixed(1)} (${comMetaAtingida}/${vals.length} ≥ ${alvo})`;
        }
      }
    }
    
    if(pct === null) {
      return `<div class="barrow"><div class="name">${p.id} · ${esc(p.curto)}</div>
      <div class="track"></div><div class="num" style="color:var(--muted);font-size:11px">n/d</div></div>`;
    }
    
    const c = pct>75?'var(--good)':pct>50?'var(--s1)':pct>25?'var(--warning)':'var(--critical)';
    const tr = R.trunc && R.trunc[p.id];
    
    return `<div class="barrow clickable" data-p="${p.id}" title="${esc(p.desc)} — ${p.pts} pontos — denominador ${R.denom[p.id]}${tr?' (truncado pelo filtro etário da exportação)':''}">
      <div class="name">${tr?'<span style="color:var(--warning)" title="denominador truncado">▲ </span>':''}${p.id} · ${esc(p.curto)} <span style="color:var(--muted)">(n=${R.denom[p.id]})${detalhe}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${c}"></div></div>
      <div class="num">${pct.toFixed(0)}%</div></div>`;
  }).join('');
  document.querySelectorAll(`#bars-${code} .barrow.clickable`).forEach(el=>el.onclick=()=>{
    const d = document.querySelector(`#pend-${code} details[data-p="${el.dataset.p}"]`);
    if(d){ d.open=true; d.scrollIntoView({behavior:'smooth',block:'center'}); }
  });
}

/* ---------- lista suspensa de pendências, com marcação de concluído ---------- */
function renderPend(code){
  const ds = STATE.datasets[code], prats = praticasDe(code), C = colsDe(code);
  const el = document.getElementById('pend-'+code);
  const cont = contagemFeito(code);

  const blocos = prats.map(p=>{
    if(ds.resumo.naoAval[p.id]) return `<div class="pend"><div style="display:flex;justify-content:space-between;gap:8px">
      <span style="font-weight:600;font-size:13.5px">${p.id} · ${esc(p.curto)}</span>
      <span class="chip na">${esc(p.semDados||'coluna não encontrada')}</span></div></div>`;
    const lista = ds.rows.map((r,ix)=>({r,ix,st:statusPratica(code,r,p), ev: code==='C3' ? evolucaoC3(r,p.id) : null}))
      .filter(x=>x.st==='venc'||x.st==='aven')
      /* vencidas primeiro; dentro de cada grupo, quem está mais perto da meta aparece antes */
      .sort((a,b)=> (a.st==='venc'?0:1) - (b.st==='venc'?0:1) ||
        (b.ev && a.ev ? (b.ev.v/b.ev.alvo) - (a.ev.v/a.ev.alvo) : 0));
    const evs = lista.map(x=>x.ev).filter(Boolean);
    const resumoEv = evs.length && evs[0].alvo>1
      ? `<span class="chip" style="background:var(--grid);color:var(--text-secondary)" title="Média de registros entre as gestantes pendentes">média ${(evs.reduce((a,e)=>a+e.n,0)/evs.length).toFixed(1).replace('.',',')}/${evs[0].alvo}</span>`
      : '';
    if(!lista.length) return `<div class="pend"><div style="display:flex;justify-content:space-between;gap:8px">
      <span style="font-weight:600;font-size:13.5px">${p.id} · ${esc(p.curto)}</span>
      <span class="chip ok">100% cumprido</span></div></div>`;
    const itens = lista.map(x=>{
      const done = marcado(code, x.r, p.id);
      const meta = code==='C3'
        ? `MA ${esc((x.r[C.micro]||'').replace(/"/g,''))} · ${x.r._av.ig} sem · ${esc(x.r[C.tel]||x.r[C.tel2]||'sem telefone')}`
        : `MA ${esc((x.r[C.micro]||'').replace(/"/g,''))} · ${x.r._av.idade==null?'':x.r._av.idade+' anos'} · ${esc(x.r[C.tel]||'sem telefone')}`;
      const tag = x.st==='venc' ? '<span class="tag v">vencida</span>' : '<span class="tag a">a vencer</span>';
      let evo = '<span></span>';
      if(x.ev){
        const pc = x.ev.v/x.ev.alvo*100;
        const cor = pc>=75?'var(--s1)':pc>=40?'var(--warning)':'var(--critical)';
        evo = `<span class="evo" title="${esc(x.ev.falta||'meta atingida')}">
          <span class="evbar"><i style="width:${pc}%;background:${cor}"></i></span>
          <b>${x.ev.txt}</b><small>${esc(x.ev.falta)}</small></span>`;
      }
      return `<label class="pitem${done?' done':''}" data-p="${p.id}" data-ix="${x.ix}" data-st="${x.st}" data-busca="${esc((x.r[C.nome]||'').toLowerCase())}">
        <input type="checkbox" ${done?'checked':''}>
        <span class="who">${esc(x.r[C.nome])}</span>
        ${evo}
        <span class="meta">${meta} ${tag}</span></label>`;
    }).join('');
    return `<details class="pend" data-p="${p.id}">
      <summary><span>${p.id} · ${esc(p.curto)}</span>
        <span>
          <span class="chip no" data-role="venc"></span>
          <span class="chip na" data-role="aven"></span>
          <span class="chip ok" data-role="feitas"></span>
          ${resumoEv}
          <span class="chip info" title="Ganho na pontuação da equipe se todas forem resolvidas">+${(p.pts*lista.length/denomPratica(code,p.id)).toFixed(1)} pts</span>
        </span></summary>
      <input type="search" class="psearch" placeholder="filtrar nomes desta prática...">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn" data-act="all" data-p="${p.id}">Marcar todos</button>
        <button class="btn" data-act="none" data-p="${p.id}">Desmarcar todos</button>
      </div>
      <div class="plist">${itens}</div>
    </details>`;
  }).join('');

  el.innerHTML = `
    <div class="pendtools">
      <span style="font-size:12.5px;color:var(--text-secondary)" id="pcount-${code}">
        ${cont.ok} de ${cont.tot} pendências marcadas como concluídas</span>
      <div class="pbar"><i id="pbar-${code}" style="width:${cont.tot? cont.ok/cont.tot*100:0}%"></i></div>
      <button class="btn" data-act="save" data-code="${code}">Salvar progresso</button>
      <button class="btn" data-act="load" data-code="${code}">Retomar progresso</button>
      <button class="btn" data-act="clear" data-code="${code}">Limpar marcações</button>
    </div>
    ${blocos}`;

  el.querySelectorAll('.pitem input').forEach(inp=>{
    inp.onchange = ()=>{
      const lab = inp.closest('.pitem');
      const r = ds.rows[+lab.dataset.ix];
      const k = chaveFeito(code, r, lab.dataset.p);
      if(inp.checked) STATE.feito[k] = true; else delete STATE.feito[k];
      lab.classList.toggle('done', inp.checked);
      atualizarPend(code, lab.dataset.p);
    };
  });
  el.querySelectorAll('.psearch').forEach(s=>{
    s.oninput = ()=>{
      const q = s.value.trim().toLowerCase();
      s.closest('details').querySelectorAll('.pitem').forEach(it=>{
        it.style.display = (!q || it.dataset.busca.includes(q)) ? '' : 'none';
      });
    };
  });
  el.querySelectorAll('button[data-act="all"],button[data-act="none"]').forEach(b=>{
    b.onclick = ev=>{
      ev.preventDefault();
      const on = b.dataset.act==='all';
      b.closest('details').querySelectorAll('.pitem').forEach(it=>{
        if(it.style.display==='none') return;
        const r = ds.rows[+it.dataset.ix], k = chaveFeito(code, r, it.dataset.p);
        if(on) STATE.feito[k]=true; else delete STATE.feito[k];
        it.classList.toggle('done', on);
        it.querySelector('input').checked = on;
      });
      atualizarPend(code, b.dataset.p);
    };
  });
  el.querySelector('button[data-act="save"]').onclick = ()=>salvarProgresso();
  el.querySelector('button[data-act="load"]').onclick = ()=>document.getElementById('fileProg').click();
  el.querySelector('button[data-act="clear"]').onclick = ()=>{
    if(!confirm('Remover todas as marcações de concluído deste painel?')) return;
    Object.keys(STATE.feito).forEach(k=>{ if(k.startsWith(code+'|')) delete STATE.feito[k]; });
    renderPend(code); atualizarPend(code);
  };
  atualizarPend(code);
}

/* atualiza contadores e nota projetada sem fechar as listas abertas */
function atualizarPend(code, pid){
  const ds = STATE.datasets[code], el = document.getElementById('pend-'+code);
  if(!el) return;
  const alvos = pid ? [el.querySelector(`details[data-p="${pid}"]`)] : [...el.querySelectorAll('details[data-p]')];
  alvos.filter(Boolean).forEach(d=>{
    const itens = [...d.querySelectorAll('.pitem')];
    const abertos = itens.filter(i=>!i.classList.contains('done'));
    const venc = abertos.filter(i=>i.dataset.st==='venc').length;
    const aven = abertos.filter(i=>i.dataset.st==='aven').length;
    const feitas = itens.length - abertos.length;
    const set = (role, txt, show)=>{ const c=d.querySelector(`[data-role="${role}"]`);
      if(c){ c.textContent = txt; c.style.display = show? '' : 'none'; } };
    set('venc', `${venc} vencida${venc!==1?'s':''}`, venc>0);
    set('aven', `${aven} a vencer`, aven>0);
    set('feitas', `${feitas} concluída${feitas!==1?'s':''}`, feitas>0);
  });
  const cont = contagemFeito(code);
  const cnt = document.getElementById('pcount-'+code);
  if(cnt) cnt.textContent = `${cont.ok} de ${cont.tot} pendências marcadas como concluídas`;
  const bar = document.getElementById('pbar-'+code);
  if(bar) bar.style.width = (cont.tot? cont.ok/cont.tot*100 : 0)+'%';
  const proj = projecao(code);
  const box = document.getElementById('proj-'+code);
  if(box){
    if(proj.ganho > 0){
      const c = classificar(proj.nota);
      box.style.display = '';
      box.innerHTML = `<span class="lab">Nota projetada com as conclusões</span>
        <div class="val" style="color:${c.color}">${proj.nota.toFixed(1)}<small>/100</small></div>

function renderMicroGen(code){

function renderTab(code){
  const def = byCode(code), ds = STATE.datasets[code];
  const f1 = document.getElementById('f1-'+code).value,
        f2 = document.getElementById('f2-'+code).value,
        q  = document.getElementById('f3-'+code).value.trim().toLowerCase();
  let rows = ds.rows.filter(r=>{
    if(f1 && (r[ds.col.micro]||'').replace(/"/g,'')!==f1) return false;
    const pend = def.praticas.some(p=>r._av.res[p.id]===false);
    if(f2==='pend' && !pend) return false;
    if(f2==='ok' && pend) return false;
    if(q){ const blob = ds.header.map(h=>r[h]).join(' ').toLowerCase(); if(!blob.includes(q)) return false; }
    return true;
  });
  const ord = STATE.ordem[code] || {col:'pontos', dir:1};
  const val = {
    nome: r=>r[ds.col.nome]||'', micro: r=>r[ds.col.micro]||'', idade: r=>r._av.idade||0,
    pontos: r=>r._av.avaliaveis? r._av.bruto/r._av.avaliaveis*100 : 0
  };
  rows.sort((a,a2)=>{ const f=val[ord.col]||val.pontos; const x=f(a),y=f(a2);
    return (typeof x==='number'? x-y : String(x).localeCompare(String(y),'pt-BR'))*ord.dir; });

  const head = `<thead><tr>
    <th data-c="nome">Nome</th><th data-c="micro">Microárea</th><th data-c="idade">Idade</th>
    <th>Práticas (${def.praticas.map(p=>p.id).join(' ')})</th>
    <th data-c="pontos" class="num">Pontos</th>
    <th>Telefone</th><th>Endereço</th></tr></thead>`;
  const body = rows.map(r=>{
    const pills = def.praticas.map(p=>{
      const v = r._av.res[p.id];
      const cls = v===true?'y': v===false?'n':'x';
      let valor = '';
      // Mostrar o valor numérico para práticas específicas do C2
      if(def.code==='C2'){
        if(p.id==='B' && ds.col.qAtend){ // Consultas até 24 meses
          const n = num(r[ds.col.qAtend]);
          valor = `${n}/9`;
        }else if(p.id==='C' && ds.col.qPesoAlt){ // Registros peso/altura
          const n = num(r[ds.col.qPesoAlt]);
          valor = `${n}/9`;
        }else if(p.id==='D' && ds.col.qVis){ // Visitas domiciliares
          const n = num(r[ds.col.qVis]);
          valor = `${n}/2`;
        }
      }
      let t = v===true?'cumprida': v===false?'PENDENTE': (r._av.aplic&&r._av.aplic[p.id]===false?'fora da faixa etária':'não avaliável');
      if(valor) t += ` (${valor})`;
      const titul = `${p.id}: ${esc(p.curto)} — ${t}`;
      return `<span class="pill ${cls}" title="${titul}">${p.id}${valor?`<span class="pv">${valor}</span>`:''}</span>`;
    }).join('');
    const pt = r._av.avaliaveis? r._av.bruto/r._av.avaliaveis*100 : null;
    return `<tr><td>${esc(r[ds.col.nome])}</td><td>${esc((r[ds.col.micro]||'').replace(/"/g,''))}</td>
      <td class="num">${r._av.idade===null?'—':r._av.idade}</td>
      <td><div class="pillrow">${pills}</div></td>
      <td class="num">${pt===null?'—':`<span class="chip ${pt>50?'ok':pt>25?'na':'no'}">${pt.toFixed(0)}</span>`}</td>
      <td>${esc(r[ds.col.tel]||'—')}</td><td>${esc((r[ds.col.rua]||'')+', '+(r[ds.col.bairro]||''))}</td></tr>`;
  }).join('');
  const t = document.getElementById('tab-'+code);
  t.innerHTML = head + `<tbody>${body}</tbody><tfoot><tr><td colspan="7" style="color:var(--muted);font-size:12px">${rows.length} de ${ds.rows.length} registro(s)</td></tr></tfoot>`;
  t.querySelectorAll('th[data-c]').forEach(th=>th.onclick=()=>{
    const o = STATE.ordem[code] || {col:'pontos',dir:1};
    STATE.ordem[code] = (o.col===th.dataset.c)? {col:o.col,dir:-o.dir} : {col:th.dataset.c,dir:1};
    renderTab(code);
  });
}

function recalcVac(){
  if(STATE.datasets['C2']) computar(STATE.datasets['C2']);
  renderIndicador('C2'); renderOverview();
}
function filtroVac(){
  const V = STATE.vacina;
  const m = document.getElementById('vacMicro').value,
        f = document.getElementById('vacFaixa').value,
        e = document.getElementById('vacEsc').value,
        q = document.getElementById('vacBusca').value.trim().toLowerCase();
  return [...V.pessoas.values()].filter(p=>{
    if(m && p.micro!==m) return false;
    if(f && !(p.meses!==null && p.meses < +f)) return false;
    if(e==='c2' && dosesC2(p).length===0) return false;
    if(q && !((p.nome+' '+p.end+' '+p.tel).toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=> dosesC2(b).length-dosesC2(a).length || b.doses.length-a.doses.length);
}
function renderVacTab(){
  const lista = filtroVac();
  document.getElementById('vacTab').innerHTML =
    `<thead><tr><th>Criança</th><th>Idade</th><th>Microárea</th><th class="num">Doses atrasadas</th>
      <th class="num">Impactam o C2</th><th>Vacinas em atraso</th><th>Telefone</th><th>Endereço</th></tr></thead>
    <tbody>${lista.map(p=>{
      const c2 = dosesC2(p);
      const relev = d => STATE.vacSel[d.imuno] && (!STATE.vacSoPrimaria || DOSE_PRIMARIA.test(d.dose||''));
      const grupos = {};
      p.doses.forEach(d=>{ const k = d.imuno+'|'+(relev(d)?'1':'0');
        (grupos[k] = grupos[k] || {im:d.imuno, rel:relev(d), doses:[]}).doses.push(d.dose); });
      const chips = Object.values(grupos)
        .sort((a,b)=> (b.rel?1:0)-(a.rel?1:0) || b.doses.length-a.doses.length)
        .map(g=>`<span class="chip ${g.rel?'no':'na'}" title="${esc(g.im)}: ${esc(g.doses.join(', '))}${g.rel?' — conta para a prática E do C2':' — fora do escopo do indicador'}">${esc(g.im.replace(/^Vacina\s*/i,''))} · ${esc(g.doses.join('/'))}</span>`)
        .join(' ');
      return `<tr><td>${esc(p.nome)}</td><td>${esc(p.idade)}</td><td>${esc(p.micro)}</td>
        <td class="num">${p.doses.length}</td>
        <td class="num">${c2.length?`<span class="chip no">${c2.length}</span>`:'<span class="chip ok">0</span>'}</td>
        <td style="white-space:normal;min-width:340px;max-width:520px;line-height:2">${chips}</td>
        <td>${esc(p.tel||'—')}</td><td>${esc(p.end)}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td colspan="8" style="color:var(--muted);font-size:12px">${lista.length} de ${STATE.vacina.pessoas.size} criança(s)</td></tr></tfoot>`;
}
function exportVac(){
  const lista = filtroVac();
  const l = [['Criança','Idade','Microárea','Telefone','Endereço','Imunobiológico','Dose','Impacta o C2'].join(';')];
  lista.forEach(p=>p.doses.forEach(d=>{
    const rel = STATE.vacSel[d.imuno] && (!STATE.vacSoPrimaria || DOSE_PRIMARIA.test(d.dose||''));
    l.push([p.nome,p.idade,p.micro,p.tel,p.end,d.imuno,d.dose,rel?'SIM':'NAO']
      .map(x=>String(x==null?'':x).replace(/;/g,',')).join(';'));
  }));
  const blob=new Blob(['﻿'+l.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='busca_ativa_vacinacao.csv'; a.click();
}

    <div class="bars" id="bars-C3"></div></div>
  <div class="card"><h2>Pendências nominais</h2>
    <p class="desc">Clique em uma prática para abrir a lista e marque cada gestante conforme a ação for realizada.
    <span class="k">Vencida</span> = já exigível pela idade gestacional e sem registro. <span class="k">A vencer</span> = ainda dentro do prazo.
    A marcação organiza o trabalho da equipe e projeta o efeito na nota, mas não substitui o registro no PEC.</p>
    <div id="pend-C3"></div></div>
  <div class="grid g2">
    <div class="card"><h2>Distribuição por idade gestacional</h2><div class="bars" id="ig-C3"></div></div>
    <div class="card"><h2>Desempenho por microárea</h2><div class="bars" id="micro-C3"></div></div>
  </div>
  <div class="card"><h2>Lista nominal e pontuação individual</h2>
    <div class="filters">
      <div class="fgroup"><label>Microárea</label><select id="c3Micro"><option value="">Todas</option>${micros.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div>
      <div class="fgroup"><label>Risco gestacional</label><select id="c3Risco"><option value="">Todos</option>${riscos.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div>
      <div class="fgroup"><label>Idade gestacional</label><select id="c3Faixa"><option value="">Todas</option>
        <option value="1">1º trimestre</option><option value="2">2º trimestre</option><option value="3">3º trimestre</option><option value="p">Puérperas</option></select></div>
      <div class="fgroup"><label>Situação</label><select id="c3Sit"><option value="">Todas</option>
        <option value="pend">Com pendência vencida</option><option value="ok">Sem pendência vencida</option></select></div>
      <div class="fgroup" style="flex:1;min-width:200px"><label>Buscar</label><input type="search" id="c3Busca" placeholder="nome, rua, CPF, CNS..."></div>
    </div>
    <div class="tablewrap"><table id="c3Tab"></table></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--good)"></i>Cumprido</span>
      <span><i class="sw" style="background:color-mix(in srgb,var(--critical) 22%,transparent)"></i>Pendente e já exigível</span>
      <span><i class="sw" style="background:var(--grid)"></i>Ainda não exigível</span></div></div>
  <div class="card"><h2>Alertas clínicos</h2>
    <p class="desc">Sinalizações extraídas do relatório, fora do escopo do indicador.</p>
    <div class="grid g3" id="c3Alertas"></div>
    <div class="note">O IMC usa a última medição feita durante a gestação, portanto superestima o estado nutricional
    pré-gestacional. Use como sinalizador de acompanhamento e de conferência do registro de altura.</div></div>`;

  const c=C;
  document.getElementById('bars-C3').innerHTML = PRAT3.map(pr=>{
    const pct=R.pct[pr.id], col=pct>75?'var(--good)':pct>50?'var(--s1)':pct>25?'var(--warning)':'var(--critical)';
    return `<div class="barrow clickable" data-p="${pr.id}" title="${esc(pr.desc)} — ${pr.pts} pontos">
      <div class="name">${pr.id} · ${esc(pr.curto)}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="num">${pct.toFixed(0)}%</div></div>`;
  }).join('');
  document.querySelectorAll('#bars-C3 .barrow').forEach(el=>el.onclick=()=>{
    const d=document.querySelector(`#pend-C3 details[data-p="${el.dataset.p}"]`);
    if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'});}
  });
  renderPend('C3');
  const faixas=[['Até 13 sem (1º tri)',r=>r._av.ig<=13],['14 a 27 sem (2º tri)',r=>r._av.ig>=14&&r._av.ig<=27],
                ['28 a 36 sem (3º tri)',r=>r._av.ig>=28&&r._av.ig<=36],['37 sem ou mais',r=>r._av.ig>=37]];
  const maxF=Math.max(...faixas.map(f=>all.filter(f[1]).length),1);
  document.getElementById('ig-C3').innerHTML = faixas.map(f=>{const q=all.filter(f[1]).length;
    return `<div class="barrow"><div class="name">${f[0]}</div><div class="track"><div class="fill" style="width:${q/maxF*100}%"></div></div><div class="num">${q}</div></div>`;}).join('');
  const mm={}; all.forEach(r=>{const m=(r[c.micro]||'').replace(/"/g,'')||'—';(mm[m]=mm[m]||[]).push(r._av.bruto);});
  document.getElementById('micro-C3').innerHTML = Object.entries(mm).map(([k,v])=>({m:k,n:v.length,med:v.reduce((a,b)=>a+b,0)/v.length}))
    .sort((a,b)=>b.med-a.med).map(a=>{const col=a.med>75?'var(--good)':a.med>50?'var(--s1)':a.med>25?'var(--warning)':'var(--critical)';
    return `<div class="barrow"><div class="name">Microárea ${esc(a.m)} (n=${a.n})</div>
      <div class="track"><div class="fill" style="width:${a.med}%;background:${col}"></div></div><div class="num">${a.med.toFixed(0)}</div></div>`;}).join('');

  const paAlt=all.filter(r=>{const m=String(r[c.paUlt]||'').match(/(\d+)\s*\/\s*(\d+)/);return m&&(+m[1]>=140||+m[2]>=90);});
  const imc=all.map(r=>{const pp=flt(r[c.peso]),aa=flt(r[c.altura]);return (pp&&aa)?{r,v:pp/Math.pow(aa/100,2)}:null;}).filter(Boolean);
  const cards=[['Pressão arterial alterada (≥140/90)',paAlt,'critical'],
    ['Gestação na adolescência',all.filter(r=>/^1[0-9] anos/.test(r[c.idade]||'')),'serious'],
    ['Risco gestacional não habitual',all.filter(r=>!vazio(r[c.risco])&&!/habitual/i.test(r[c.risco])),'warning'],
    ['IMC atual ≥ 30',imc.filter(x=>x.v>=30),'warning',x=>x.r],
    ['IMC atual < 18,5',imc.filter(x=>x.v<18.5),'warning',x=>x.r],
    ['Sem atendimento médico há mais de 30 dias',all.filter(r=>diasDesdeCol(r,c.dMed)>30),'serious'],
    ['Sem visita domiciliar há mais de 30 dias',all.filter(r=>diasDesdeCol(r,c.dVis)>30),'serious'],
    ['37 semanas ou mais (parto iminente)',all.filter(r=>r._av.ig>=37),'critical']];
  document.getElementById('c3Alertas').innerHTML = cards.map(([lab,list,st,pick])=>{
    const nomes=list.slice(0,8).map(x=>esc((pick?pick(x):x).Nome)).join(' · ');
    return `<div class="tile"><span class="lab">${lab}</span>
      <div class="val" style="color:var(--${list.length?st:'muted'})">${list.length}</div>
      <div class="foot">${nomes||'nenhuma'}${list.length>8?' e mais '+(list.length-8):''}</div></div>`;}).join('');

  ['c3Micro','c3Risco','c3Faixa','c3Sit'].forEach(id=>document.getElementById(id).onchange=renderC3Tab);
  document.getElementById('c3Busca').oninput = renderC3Tab;
  renderC3Tab();
}

function renderC3Tab(){
  const ds=STATE.datasets['C3'], C=C3COL;
  const f={micro:v('c3Micro'),risco:v('c3Risco'),faixa:v('c3Faixa'),sit:v('c3Sit'),q:v('c3Busca').trim().toLowerCase()};
  function v(id){const e=document.getElementById(id);return e?e.value:'';}
  let rows=ds.rows.filter(r=>{
    if(f.micro && (r[C.micro]||'').replace(/"/g,'')!==f.micro) return false;
    if(f.risco && r[C.risco]!==f.risco) return false;
    if(f.faixa==='1'&&!(r._av.ig<=13))return false;
    if(f.faixa==='2'&&!(r._av.ig>=14&&r._av.ig<=27))return false;
    if(f.faixa==='3'&&!(r._av.ig>=28))return false;
    if(f.faixa==='p'&&!r._av.puerpera)return false;
    const pend=PRAT3.some(p=>!r._av.res[p.id]&&r._av.devido[p.id]);
    if(f.sit==='pend'&&!pend)return false;
    if(f.sit==='ok'&&pend)return false;
    if(f.q){const blob=[r.Nome,r[C.cpf],r[C.cns],r[C.rua],r[C.bairro],r[C.cel],r[C.contato]].join(' ').toLowerCase();if(!blob.includes(f.q))return false;}
    return true;
  });
  const ord=STATE.ordem['C3']||{col:'bruto',dir:1};
  const getters={nome:r=>r.Nome,micro:r=>r[C.micro],ig:r=>r._av.ig,bruto:r=>r._av.bruto,ajust:r=>r._av.ajust,cons:r=>num(r[C.atendPN])};
  rows.sort((a,b)=>{const g=getters[ord.col]||getters.bruto;const x=g(a),y=g(b);
    return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'pt-BR'))*ord.dir;});
  const t=document.getElementById('c3Tab');
  t.innerHTML=`<thead><tr><th data-c="nome">Nome</th><th data-c="micro">Microárea</th><th data-c="ig">IG</th><th>DPP</th><th>Risco</th>
    <th>${PRAT3.map(p=>p.id).join(' ')}</th><th data-c="bruto" class="num">Bruta</th><th data-c="ajust" class="num">Ajustada</th>
    <th data-c="cons" class="num">Consultas</th><th>Telefone</th><th>Endereço</th><th>CPF</th><th>CNS</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.Nome)}</td><td>${esc((r[C.micro]||'').replace(/"/g,''))}</td>
      <td class="num">${r._av.ig} sem</td><td>${fmtDate(r[C.dpp]||r[C.dppE])}</td><td>${esc(r[C.risco])}</td>
      <td><div class="pillrow">${PRAT3.map(p=>{const cls=r._av.res[p.id]?'y':(r._av.devido[p.id]?'n':'p');
        const tt=r._av.res[p.id]?'cumprida':(r._av.devido[p.id]?'PENDENTE — já exigível':'ainda não exigível');
        return `<span class="pill ${cls}" title="${p.id}: ${esc(p.curto)} — ${tt}">${p.id}</span>`;}).join('')}</div></td>
      <td class="num"><span class="chip ${r._av.bruto>50?'ok':r._av.bruto>25?'na':'no'}">${r._av.bruto}</span></td>
      <td class="num"><span class="chip ${r._av.ajust>50?'ok':r._av.ajust>25?'na':'no'}">${r._av.ajust.toFixed(0)}</span></td>
      <td class="num">${num(r[C.atendPN])}</td><td>${esc(r[C.cel]||r[C.contato]||'—')}</td>
      <td>${esc((r[C.rua]||'')+', '+(r[C.bairro]||''))}</td><td>${esc(r[C.cpf])}</td><td>${esc(r[C.cns])}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="13" style="color:var(--muted);font-size:12px">${rows.length} de ${ds.rows.length} registro(s)</td></tr></tfoot>`;
  t.querySelectorAll('th[data-c]').forEach(th=>th.onclick=()=>{
    const o=STATE.ordem['C3']||{col:'bruto',dir:1};
    STATE.ordem['C3']=(o.col===th.dataset.c)?{col:o.col,dir:-o.dir}:{col:th.dataset.c,dir:1};
    renderC3Tab();
  });
}

/* ============================================================
   12. METODOLOGIA
   ============================================================ */
function renderMetodo(){
  const tab = (def) => `<div class="tablewrap" style="max-height:none;margin-bottom:8px"><table>
    <thead><tr><th>Prática</th><th>Descrição</th><th class="num">Pontos</th>${def.tipo==='faixas'?'<th>Faixa etária</th>':''}</tr></thead>
    <tbody>${def.praticas.map(p=>`<tr><td class="k">${p.id}</td><td style="white-space:normal">${esc(p.desc)}</td>
      <td class="num">${p.pts}</td>${def.tipo==='faixas'?`<td>${p.faixa[0]} a ${p.faixa[1]} anos</td>`:''}</tr>`).join('')}
      <tr><td colspan="2" class="k">Total</td><td class="num k">100</td>${def.tipo==='faixas'?'<td></td>':''}</tr></tbody></table></div>`;

  document.getElementById('p-metodo').innerHTML = `
  <div class="card">
    <h2>Como o painel calcula</h2>
    <p class="desc">Regras conforme as notas metodológicas do Componente Qualidade da APS (Portaria GM/MS nº 3.493/2024 e
    Nota Técnica nº 3/2025-CGESCO/DESCO/SAPS/MS). Para todos os indicadores de boas práticas, a fórmula é
    numerador dividido por denominador, resultando de 0 a 100 pontos.</p>
    <div class="note"><span class="k">Classificação (C2 a C7):</span> Ótimo &gt;75 e ≤100 · Bom &gt;50 e ≤75 ·
    Suficiente &gt;25 e ≤50 · Regular ≤25.<br>
    <span class="k">Classificação do C1:</span> Ótimo &gt;50 e ≤70% · Bom &gt;30 e ≤50% · Suficiente &gt;10 e ≤30% ·
    Regular ≤10% ou acima de 70%.</div>
    <div class="note"><span class="k">Prática E do C2, situação vacinal:</span> o relatório de acompanhamento não informa
    o esquema vacinal. O painel calcula essa prática a partir do <span class="k">Relatório de Busca Ativa de Vacinação</span>
    do e-SUS, com grupo-alvo Crianças e status Atrasada. A criança é considerada em dia quando não possui, naquele relatório,
    nenhuma dose atrasada entre os imunobiológicos exigidos pelo indicador. Crianças do denominador do C2 que não aparecem na
    busca ativa são tratadas como em dia, premissa válida desde que os dois relatórios sejam da mesma equipe e do mesmo momento.
    A seleção de quais imunobiológicos contam é editável na aba C2.</div>
    <div class="note"><span class="k">Filtro de exportação do C7:</span> o relatório de Saúde da Mulher precisa ser
    exportado com faixa etária de <span class="k">9 até 69 anos</span>. As práticas A, C e D pedem de 14 a 69 anos, mas a
    prática B avalia a vacina HPV em meninas de 9 a 14 anos. Uma exportação iniciada aos 14 anos deixa de fora quase toda
    a população dessa prática e produz um denominador truncado, situação que o painel detecta e sinaliza na aba do
    indicador.</div>
    <div class="note warn"><span class="k">Limite conhecido do relatório de acompanhamento:</span> o e-SUS informa apenas a
    data da última visita domiciliar, não o histórico completo. As práticas que exigem duas visitas com intervalo mínimo de
    30 dias (C2 D, C4 D, C5 D e C6 C) são verificadas de forma aproximada, checando se houve visita dentro do período. O
    número real pode ser menor que o exibido. Para conferência exata, use o relatório de visitas domiciliares do e-SUS.</div>
    ${INDIC.filter(i=>i.tipo!=='razao').map(i=>`
      <h3>${i.code} · ${esc(i.nome)}</h3>
      <p class="desc">Denominador: ${esc(i.pop||'')}</p>
      ${i.code==='C3'? `<div class="tablewrap" style="max-height:none;margin-bottom:8px"><table>
        <thead><tr><th>Prática</th><th>Descrição</th><th class="num">Pontos</th></tr></thead>
        <tbody>${PRAT3.map(p=>`<tr><td class="k">${p.id}</td><td style="white-space:normal">${esc(p.desc)}</td><td class="num">${p.pts}</td></tr>`).join('')}
        <tr><td colspan="2" class="k">Total</td><td class="num k">100</td></tr></tbody></table></div>` : tab(i)}
      ${i.code==='C7'? `<p class="desc">No C7 cada boa prática tem seu próprio denominador, definido pela faixa etária.
        A nota da equipe é a soma ponderada: 20 × (cumpridas de A ÷ pessoas de 25 a 64 anos) + 30 × (B ÷ 9 a 14 anos) +
        30 × (C ÷ 14 a 69 anos) + 20 × (D ÷ 50 a 69 anos). O máximo continua sendo 100 pontos.</p>`:''}
      ${i.code==='C3'? `<p class="desc">Além da nota bruta, o painel calcula a <span class="k">nota ajustada pela idade
        gestacional</span>, que retira do denominador as práticas ainda não exigíveis. Janelas adotadas: 1ª consulta desde
        o início; sorologias do 1º trimestre a partir de 14 semanas; saúde bucal a partir de 14 semanas; dTpa a partir de
        20 semanas; sorologias do 3º trimestre a partir de 28 semanas; consultas, aferições, peso e altura e visitas a
        partir de 36 semanas; consulta e visita de puerpério apenas para puérperas.</p>`:''}
    `).join('')}
    <h3>C1 · Mais Acesso à Atenção Primária</h3>
    <p class="desc">Numerador: número de atendimentos por demanda programada. Denominador: número total de atendimentos de
    todos os tipos de demanda. Não é obtido pelo relatório de acompanhamento de condições de saúde, por isso a aba C1 usa
    entrada manual a partir do relatório de produção.</p>
    <h3>Origem dos dados</h3>
    <p class="desc">Relatório de Acompanhamento de Condições de Saúde do e-SUS APS (PEC), exportado em CSV, uma lista
    temática por indicador. O painel trata automaticamente a codificação Latin-1 usada pelo e-SUS e usa a data de geração
    do relatório como referência para todos os cálculos de prazo.</p>
  </div>`;
}

/* ============================================================
   13. EXPORTAÇÃO
   ============================================================ */
function exportPend(){
  const linhas = [['Indicador','Nome','Microárea','Idade/IG','Telefone','Endereço','Prática','Descrição','Situação','Pontos','Concluído na equipe'].join(';')];
  let algo = false;
  Object.keys(STATE.datasets).forEach(code=>{
    const ds = STATE.datasets[code], def = byCode(code);
    if(code==='C3'){
      ds.rows.forEach(r=>PRAT3.forEach(p=>{
        if(r._av.res[p.id]) return; algo=true;
        linhas.push([code,r.Nome,(r[C3COL.micro]||'').replace(/"/g,''),r._av.ig+' sem',
          r[C3COL.cel]||r[C3COL.contato]||'',(r[C3COL.rua]||'')+' '+(r[C3COL.bairro]||''),
          p.id+' - '+p.curto,p.desc,r._av.devido[p.id]?'VENCIDA':'A vencer',p.pts,
          marcado('C3',r,p.id)?'SIM':'NAO']
          .map(x=>String(x==null?'':x).replace(/;/g,',')).join(';'));
      }));
    }else{
      ds.rows.forEach(r=>def.praticas.forEach(p=>{
        if(r._av.res[p.id]!==false) return; algo=true;
        linhas.push([code,r[ds.col.nome],(r[ds.col.micro]||'').replace(/"/g,''),r._av.idade==null?'':r._av.idade+' anos',
          r[ds.col.tel]||'',(r[ds.col.rua]||'')+' '+(r[ds.col.bairro]||''),
          p.id+' - '+p.curto,p.desc,'PENDENTE',p.pts, marcado(code,r,p.id)?'SIM':'NAO']
          .map(x=>String(x==null?'':x).replace(/;/g,',')).join(';'));
      }));
    }
  });
  if(!algo){ alert('Carregue ao menos um relatório para exportar as pendências.'); return; }
  const blob = new Blob(['﻿'+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='pendencias_brasil360.csv'; a.click();
}

/* ============================================================
   14. CARGA E ATUALIZAÇÃO
   ============================================================ */
function ingest(text, filename){
  const d = parseEsus(text, filename);
  if(d.meta.code === 'VAC'){
    /* nova exportação da mesma equipe e do mesmo grupo-alvo substitui a anterior */
    const ix = STATE.vacinas.findIndex(v=> v.meta.arquivo===d.meta.arquivo ||
      (v.meta.equipe===d.meta.equipe && (v.meta.grupo||'')===(d.meta.grupo||'')));
    if(ix>=0) STATE.vacinas[ix] = d; else STATE.vacinas.push(d);
    mergeVacinas();
    ['C2','C7'].forEach(c=>{ if(STATE.datasets[c]) computar(STATE.datasets[c]); });
    refresh();
    return;
  }
  if(!d.meta.code) throw new Error(`Lista temática "${d.meta.tema}" não reconhecida. O painel cobre gestação e puerpério, criança, diabetes, hipertensão, pessoa idosa e rastreamento de câncer.`);
  STATE.datasets[d.meta.code] = d;
  computar(d);
  refresh();
}
function refresh(){
  buildTabs(); renderOverview(); renderC1(); renderC3();
  ['C2','C4','C5','C6','C7'].forEach(renderIndicador);
  renderMetodo();
  const ds = Object.values(STATE.datasets)[0];
  document.getElementById('ctx').textContent = ds
    ? `${ds.meta.municipio||'—'} · ${ds.meta.unidade||'—'} · Equipe ${ds.meta.equipe||'—'} · ${Object.keys(STATE.datasets).length} relatório(s)`
    : 'Nenhum relatório carregado';
}
function lerArquivos(files){
  [...files].forEach(f=>{
    const fr = new FileReader();
    fr.onload = ()=>{ try{ ingest(decodeBytes(fr.result), f.name); }catch(err){ alert(f.name+': '+err.message); } };
    fr.readAsArrayBuffer(f);
  });
}

document.getElementById('btnLoad').onclick = ()=>document.getElementById('file').click();
document.getElementById('file').onchange = e=>{ lerArquivos(e.target.files); e.target.value=''; };
document.getElementById('fileProg').onchange = e=>{ if(e.target.files[0]) carregarProgresso(e.target.files[0]); e.target.value=''; };
document.getElementById('btnExport').onclick = exportPend;
document.getElementById('btnPrint').onclick = ()=>window.print();
document.getElementById('btnTheme').onclick = ()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
};
const dz=document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('on');}));
document.addEventListener('dragleave',e=>{ if(e.relatedTarget===null) dz.classList.remove('on'); });
document.addEventListener('drop',e=>{ e.preventDefault(); dz.classList.remove('on'); lerArquivos(e.dataTransfer.files||[]); });

refresh();
</script>
